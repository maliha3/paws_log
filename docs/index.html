<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paws Log</title>
<style>
    :root { color-scheme: light dark;
      --bg:#FDF6EE; --ink:#2A211B; --muted:#6B5C50; --brand:#EE9A3A;
      --line:#EADCCB; }
    @media (prefers-color-scheme: dark) { :root {
      --bg:#17120F; --ink:#F3E7DC; --muted:#B8A796; --brand:#EE9A3A;
      --line:#3A2E25; } }
    * { box-sizing: border-box; }
    body { margin:0; padding:48px 20px 96px; background:var(--bg);
      color:var(--ink); line-height:1.65;
      font:16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
        sans-serif; }
    main { max-width: 42rem; margin: 0 auto; }
    h1 { font-size:2rem; line-height:1.2; margin:0 0 .25em; }
    h2 { font-size:1.25rem; margin:2.2em 0 .6em;
      padding-top:1.2em; border-top:1px solid var(--line); }
    h2:first-of-type { border-top:0; padding-top:0; }
    a { color:var(--brand); }
    code { background:var(--line); padding:.1em .35em; border-radius:4px;
      font-size:.9em; }
    table { width:100%; border-collapse:collapse; margin:1.2em 0; }
    th, td { text-align:left; padding:.6em .8em;
      border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-size:.85em; text-transform:uppercase; letter-spacing:.04em;
      color:var(--muted); }
    ul { padding-left:1.2em; }
    li { margin:.3em 0; }
    p:first-of-type { color:var(--muted); }
</style>
</head>
<body>
<main>
<h1>Paws Log</h1>
<p>A cat care reminder app. Vaccines, deworming, flea and tick treatment,
medicines and grooming — with a nudge when something is due.</p>
<p>Everything stays on your phone. No account, no server, no tracking.</p>
<h2>Links</h2>
<ul>
<li><a href="privacy-policy.html">Privacy Policy</a></li>
<li><a href="mailto:malihazmn12@gmail.com">Support</a></li>
</ul>
</main>
</body>
</html>
